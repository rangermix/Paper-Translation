# Copy to the ignored local compose.yaml; preserve existing project/volume names.
# Inspect docs/ops/restore.md before upgrading an existing instance.
# API, worker, parser and preparation share one amd64/arm64 application image.
# All active parsers process whole pages through Docker Model Runner only.
# Docker owns the inference backend: PARSER_DMR_BACKEND=vllm (CUDA) or mlx (Metal).
# Weights prepare only on explicit use; startup/settings never download models.
# Configure the backend prerequisites in docs/deployment/extraction-acceleration.md.
# Tests/checks use an explicit separate project; see tests/README.md.
# Translation endpoint, model and credentials are configured in the application.
name: bilingual-personal-pdf

x-app: &app
  image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
  build: &app-build
    context: .
    dockerfile: deployment/images/app.Dockerfile
    args:
      SOURCE_COMMIT: "${SOURCE_COMMIT:-uncommitted}"
      SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unrecorded}"
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
  environment: &app-environment
    DATA_DIR: /data
    UPLOADS_DIR: /uploads
    PARSER_INPUTS_DIR: /parser_inputs
    PARSER_OUTPUTS_DIR: /parser_outputs
    DATABASE_CONFIG_FILE: /internal/database.json
    PROVIDER_CONFIG_DIR: /provider_config
    LOCAL_TRANSLATION_FORMATS: "${LOCAL_TRANSLATION_FORMATS:-}"
    LOCAL_TRANSLATION_BACKENDS: "${LOCAL_TRANSLATION_BACKENDS:-}"
    PARSER_DMR_BACKEND: "${PARSER_DMR_BACKEND:-vllm}"
    ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,app}"
    APP_ORIGINS: "${APP_ORIGINS:-http://localhost:${PORT:-8080},http://127.0.0.1:${PORT:-8080}}"
    READ_ONLY: "${READ_ONLY:-false}"
  volumes:
    - internal:/internal:ro
x-parser-mode: &parser-mode
  image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
  build: *app-build
  networks: [parser_model_control, model_inference]
  environment:
    PARSER_MODEL_CACHE: /model_cache
    PARSER_INPUTS: /inputs
    PARSER_OUTPUTS: /outputs
    PARSER_ACCELERATOR: dmr
    PARSER_DMR_BACKEND: "${PARSER_DMR_BACKEND:-vllm}"
    PARSER_DMR_URL: "${PARSER_DMR_URL:-http://model-runner.docker.internal}"

x-test-build: &test-build
  context: .
  dockerfile: tests/Dockerfile
services:
  init:
    <<: *app
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [python, -m, packages.maintenance, init-volumes]
    environment:
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
      PARSER_INPUTS_DIR: /parser_inputs
      PARSER_OUTPUTS_DIR: /parser_outputs
      DATABASE_CONFIG_FILE: /internal/database.json
      PROVIDER_CONFIG_DIR: /provider_config
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
      - backups:/backups
      - provider_config:/provider_config
      - pgdata:/pgdata
      - parser_models:/parser_models
    restart: "no"
  db:
    image: "${DATABASE_IMAGE:-bilingual-personal-pdf-db:local}"
    build:
      context: .
      dockerfile: deployment/images/database.Dockerfile
      args:
        SOURCE_COMMIT: "${SOURCE_COMMIT:-uncommitted}"
        SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unrecorded}"
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777", "/var/run/postgresql:rw,nosuid,size=16m,mode=1777"]
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library_runtime
      POSTGRES_PASSWORD_FILE: /internal/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - internal:/internal:ro
    networks: [backend]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U library_runtime -d library"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    networks: [backend]
    command: [python, -m, packages.maintenance, migrate]
    volumes:
      - data:/data
      - internal:/internal:ro
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  app:
    <<: *app
    networks: [backend, http, local_model_control, parser_model_control]
    command: [uvicorn, apps.api.main:app, --host, 0.0.0.0, --port, "8080"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - data:/data
      - uploads:/uploads
      - parser_outputs:/parser_outputs:ro
      - internal:/internal:ro
      - provider_config:/provider_config
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  worker:
    <<: *app
    command: [python, -m, workers.main]
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal:ro
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
      - provider_config:/provider_config:ro
    networks: [backend, provider_egress, local_model_control]
    depends_on:
      migrate: {condition: service_completed_successfully}
      parser: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, workers.main, --health]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    restart: unless-stopped
  parser:
    <<: *parser-mode
    init: true
    command: [python, -m, workers.parser.main]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - parser_inputs:/inputs:ro
      - parser_outputs:/outputs
      - parser_models:/model_cache:ro
    tmpfs: ["/tmp:rw,nosuid,size=512m,mode=1777"]
    mem_limit: 16g
    cpus: 4.0
    pids_limit: 256
    depends_on:
      init: {condition: service_completed_successfully}
      parser-models: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, workers.parser.health]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped
  # Startup/listing does not download. Only /prepare called by Settings or a
  # parse child fetches pinned files. This service never receives PDF content.
  parser-models:
    image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
    build: *app-build
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777"]
    command: [uvicorn, packages.parsers.model_service:app, --host, 0.0.0.0, --port, "8091", --no-access-log]
    environment:
      PARSER_MODEL_CACHE: /model_cache
      PARSER_DMR_URL: "${PARSER_DMR_URL:-http://model-runner.docker.internal}"
    volumes: [parser_models:/model_cache]
    networks: [parser_model_control, model_inference]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
  maintenance:
    <<: *app
    networks: [backend]
    profiles: [maintenance]
    command: [python, -m, packages.maintenance, --help]
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal:ro
      - backups:/backups
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  # Optional local translation. Startup does not download weights. The sidecar
  # offers GGUF by default; select supported formats for this host with
  # LOCAL_TRANSLATION_FORMATS (for example gguf,mlx or gguf,safetensors).
  local-model-init:
    profiles: [local-translation]
    image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
    build: *app-build
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command: [python, -c, "import os; os.chown('/model_cache',10001,10001); os.chmod('/model_cache',0o700)"]
    volumes: [local_translation_models:/model_cache]
    restart: "no"
  local-translator:
    profiles: [local-translation]
    image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
    build: *app-build
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777"]
    command: [uvicorn, packages.local_models.service:app, --host, 0.0.0.0, --port, "8090", --no-access-log]
    environment:
      LOCAL_MODEL_CACHE: /model_cache
      LOCAL_TRANSLATION_FORMATS: "${LOCAL_TRANSLATION_FORMATS:-}"
      LOCAL_TRANSLATION_BACKENDS: "${LOCAL_TRANSLATION_BACKENDS:-}"
      LOCAL_VLLM_DMR_URL: "${LOCAL_VLLM_DMR_URL:-}"
      LOCAL_GGUF_DMR_URL: "${LOCAL_GGUF_DMR_URL:-}"
    volumes: [local_translation_models:/model_cache]
    networks: [local_model_control, model_inference]
    depends_on:
      local-model-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
  # Optional Linux/WSL2 CUDA vLLM Runner. Set LOCAL_VLLM_DMR_URL to
  # http://vllm-runner:12434 and declare Safetensors for supported NVIDIA hosts.
  # LOCAL_GGUF_DMR_URL can explicitly select its llama.cpp backend for GGUF.
  # This endpoint is private to the model network and does not replace native DMR.
  # Its private port 12435 supplies read-only RAM/VRAM telemetry for shared budgets.
  vllm-runner:
    profiles: [local-vllm]
    image: "${LOCAL_VLLM_RUNNER_IMAGE:-local/paper-translation-vllm-cuda:0.19.1}"
    build:
      context: deployment/vllm-backend
    platform: linux/amd64
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODEL_RUNNER_PORT: "12434"
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes: [local_vllm_models:/models]
    networks: [model_inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 2g
    mem_limit: 16g
    restart: unless-stopped
  # Run tests/checks explicitly with -p paper-tests/-p paper-checks. Their only
  # database is disposable test-db; none of these services mounts library data.
  tests:
    profiles: [tests]
    build: *test-build
    environment:
      LIBRARY_TEST_MODE: "1"
      TEST_DATABASE_URL: postgresql+psycopg://library_test:library_test_only@test-db:5432/library_test
      ACCEPTANCE_DATABASE_URL: postgresql+psycopg://library_test:library_test_only@test-db:5432/library_test
    volumes:
      - ./.agent/harness:/app/.agent/harness:ro
      - ./.agent/relocation.json:/app/.agent/relocation.json:ro
    mem_limit: 4g
    cpus: "4"
    networks: [test_backend]
    depends_on:
      test-db: {condition: service_healthy}
  checks:
    profiles: [checks]
    build: *test-build
    command: [python, src/tools/check_package.py]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  test-db:
    profiles: [tests]
    image: postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
    platform: linux/amd64
    environment:
      POSTGRES_DB: library_test
      POSTGRES_USER: library_test
      POSTGRES_PASSWORD: library_test_only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test_backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U library_test -d library_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
volumes:
  data:
  uploads:
  internal:
  pgdata:
  parser_inputs:
  parser_outputs:
  parser_models:
  backups:
  provider_config:
  local_translation_models:
  local_vllm_models:
networks:
  backend:
    internal: true
  # Docker does not publish ports from an internal-only network. This bridge
  # exposes the app's one explicitly loopback-bound HTTP port, without a proxy.
  http:
  provider_egress:
  local_model_control:
    internal: true
  parser_model_control:
    internal: true
  # Separate test bridge; internal-only networks cannot publish the host test port.
  test_backend:
    internal: false
  # Only MLX parsing or optional local translation uses this network.
  model_inference:
