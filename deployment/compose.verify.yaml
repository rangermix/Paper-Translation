# Repository checks are independent of local hardware and production volumes.
name: bilingual-personal-pdf-verification
services:
  verify:
    build:
      context: ..
      dockerfile: deployment/images/verify.Dockerfile
    command: ["python", "src/tools/check_package.py"]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
