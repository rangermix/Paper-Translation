# Build helper: export only verified Paddle files for Docker model packaging.
# MODEL_EXPORT_DIR must be an empty directory owned by UID 10001 (or writable).
services:
  model_export:
    image: "${PARSER_IMAGE:-bilingual-personal-pdf-parser:local}"
    build:
      context: ..
      dockerfile: deployment/images/parser.Dockerfile
    platform: linux/amd64
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOCLING_ARTIFACTS_PATH: /opt/docling/models
    volumes:
      - "${MODEL_EXPORT_DIR:?Set an empty export directory}:/export"
    command: [python, /app/src/tools/export_parser_model.py, --destination, /export/paddleocr-vl-1.6]
