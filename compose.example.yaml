# Copy this file to compose.yaml in the repository root, then run:
#   docker compose up --build -d
# The copied compose.yaml is local and ignored by Git; keep this template portable.
# Existing instances: check the backup/upgrade instructions in docs/ops/restore.md first.
# Keep exactly ONE mode block active: CPU (default), CUDA, or MLX.
# To switch, comment the active block and uncomment the chosen block.
# The shared services and persistent volumes below stay the same.
# See docs/ops/restore.md for upgrades and docs/deployment/extraction-acceleration.md
# for GPU prerequisites and MLX model packaging/verification.
# Optional services: --profile local-translation; explicit run model-export, tests, checks.
# Tests/checks: use this template with a separate project name; see tests/README.md.
# Translation endpoint, model and credentials are configured in the application.
name: bilingual-personal-pdf

x-parser-build: &parser-build
  context: .
  dockerfile: deployment/images/parser.Dockerfile
  args: &parser-build-args
    SOURCE_COMMIT: "${SOURCE_COMMIT:-uncommitted}"
    SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unrecorded}"
    PARSER_FLAVOR: cpu

x-parser-environment: &parser-environment
  DOCLING_ARTIFACTS_PATH: /opt/docling/models
  PARSER_INPUTS: /inputs
  PARSER_OUTPUTS: /outputs
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# --- BEGIN CPU MODE (enabled by default) ---
x-parser-mode: &parser-mode
  image: "${PARSER_IMAGE:-bilingual-personal-pdf-parser:local}"
  build: *parser-build
  network_mode: none
  environment:
    <<: *parser-environment
    PARSER_ACCELERATOR: cpu
# --- END CPU MODE ---

# NVIDIA CUDA: requires a compatible NVIDIA GPU, driver, and Docker GPU access.
# --- BEGIN CUDA MODE (uncomment instead of CPU) ---
# x-parser-mode: &parser-mode
#   image: "${PARSER_IMAGE:-bilingual-personal-pdf-parser:cuda}"
#   build:
#     <<: *parser-build
#     args:
#       <<: *parser-build-args
#       PARSER_FLAVOR: cuda
#   network_mode: none
#   environment:
#     <<: *parser-environment
#     PARSER_ACCELERATOR: cuda
#     NVIDIA_DRIVER_CAPABILITIES: compute,utility
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]
# --- END CUDA MODE ---

# Apple MLX: requires Apple Silicon, Compose 2.38+, Docker Model Runner,
# a working vLLM Metal backend, and the packaged Paddle model.
# Replace the model ID expressions with the actual sha256 IDs, or set them
# in a root .env file. Set PARSER_MLX_VERIFIED_MODEL_ID only after image inference passes;
# see docs/deployment/extraction-acceleration.md. MLX accelerates Paddle recognition;
# layout and other parser profiles use CPU.
# --- BEGIN MLX MODE (uncomment instead of CPU, including models below) ---
# x-parser-mode: &parser-mode
#   image: "${PARSER_IMAGE:-bilingual-personal-pdf-parser:local}"
#   build: *parser-build
#   networks: [model_inference]
#   environment:
#     <<: *parser-environment
#     PARSER_ACCELERATOR: mlx
#     PADDLE_MLX_MODEL_ID: "${PADDLE_MLX_MODEL_ID:?Set the packaged Paddle model sha256 ID}"
#     PARSER_MLX_VERIFIED_MODEL_ID: "${PARSER_MLX_VERIFIED_MODEL_ID:-}"
#     NO_PROXY: model-runner.docker.internal
#     no_proxy: model-runner.docker.internal
#   models: [paddle_extraction]
# models:
#   paddle_extraction:
#     model: "${PADDLE_MLX_MODEL:-docker.io/local/paddleocr-vl-1.6:latest}"
#     context_size: 8192
# --- END MLX MODE ---

x-app: &app
  image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
  build: &app-build
    context: .
    dockerfile: deployment/images/app.Dockerfile
    args:
      SOURCE_COMMIT: "${SOURCE_COMMIT:-uncommitted}"
      SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unrecorded}"
  platform: linux/amd64
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
  environment: &app-environment
    DATA_DIR: /data
    UPLOADS_DIR: /uploads
    PARSER_INPUTS_DIR: /parser_inputs
    PARSER_OUTPUTS_DIR: /parser_outputs
    DATABASE_CONFIG_FILE: /internal/database.json
    PROVIDER_CONFIG_DIR: /provider_config
    ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,app}"
    APP_ORIGINS: "${APP_ORIGINS:-http://localhost:${PORT:-8080},http://127.0.0.1:${PORT:-8080}}"
    READ_ONLY: "${READ_ONLY:-false}"
  volumes:
    - internal:/internal:ro
x-test-build: &test-build
  context: .
  dockerfile: tests/Dockerfile
services:
  init:
    <<: *app
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [python, -m, packages.maintenance, init-volumes]
    environment:
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
      PARSER_INPUTS_DIR: /parser_inputs
      PARSER_OUTPUTS_DIR: /parser_outputs
      DATABASE_CONFIG_FILE: /internal/database.json
      PROVIDER_CONFIG_DIR: /provider_config
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
      - backups:/backups
      - provider_config:/provider_config
      - pgdata:/pgdata
    restart: "no"
  db:
    image: "${DATABASE_IMAGE:-bilingual-personal-pdf-db:local}"
    build:
      context: .
      dockerfile: deployment/images/database.Dockerfile
      args:
        SOURCE_COMMIT: "${SOURCE_COMMIT:-uncommitted}"
        SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unrecorded}"
    platform: linux/amd64
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777", "/var/run/postgresql:rw,nosuid,size=16m,mode=1777"]
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library_runtime
      POSTGRES_PASSWORD_FILE: /internal/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - internal:/internal:ro
    networks: [backend]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U library_runtime -d library"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    networks: [backend]
    command: [python, -m, packages.maintenance, migrate]
    volumes:
      - data:/data
      - internal:/internal:ro
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  app:
    <<: *app
    networks: [backend, http, local_model_control]
    command: [uvicorn, apps.api.main:app, --host, 0.0.0.0, --port, "8080"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - data:/data
      - uploads:/uploads
      - parser_outputs:/parser_outputs:ro
      - internal:/internal:ro
      - provider_config:/provider_config
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  worker:
    <<: *app
    command: [python, -m, workers.main]
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal:ro
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
      - provider_config:/provider_config:ro
    networks: [backend, provider_egress, local_model_control]
    depends_on:
      migrate: {condition: service_completed_successfully}
      parser: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, workers.main, --health]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    restart: unless-stopped
  parser:
    <<: *parser-mode
    platform: linux/amd64
    init: true
    command: [python, -m, workers.parser.main]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - parser_inputs:/inputs:ro
      - parser_outputs:/outputs
    tmpfs: ["/tmp:rw,nosuid,size=512m,mode=1777"]
    mem_limit: 16g
    cpus: 4.0
    pids_limit: 256
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, workers.parser.health]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped
  maintenance:
    <<: *app
    networks: [backend]
    profiles: [maintenance]
    command: [python, -m, packages.maintenance, --help]
    volumes:
      - data:/data
      - uploads:/uploads
      - internal:/internal:ro
      - backups:/backups
      - parser_inputs:/parser_inputs
      - parser_outputs:/parser_outputs
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  # Optional Docker-managed MLX translation. Startup does not download weights.
  local-model-init:
    profiles: [local-translation]
    image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
    build: *app-build
    platform: linux/amd64
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command: [python, -c, "import os; os.chown('/model_cache',10001,10001); os.chmod('/model_cache',0o700)"]
    volumes: [local_translation_models:/model_cache]
    restart: "no"
  local-translator:
    profiles: [local-translation]
    image: "${APP_IMAGE:-bilingual-personal-pdf-app:local}"
    build: *app-build
    platform: linux/amd64
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777"]
    command: [uvicorn, packages.local_models.service:app, --host, 0.0.0.0, --port, "8090", --no-access-log]
    environment:
      LOCAL_MODEL_CACHE: /model_cache
      PADDLE_MLX_MODEL_ID: "${PADDLE_MLX_MODEL_ID:-}"
    volumes: [local_translation_models:/model_cache]
    networks: [local_model_control, model_inference]
    depends_on:
      local-model-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
  # Explicit setup operation: supply an existing writable output directory with
  # run --volume "$MODEL_EXPORT_DIR:/export" model-export. No default host bind.
  model-export:
    profiles: [model-tools]
    image: "${PARSER_IMAGE:-bilingual-personal-pdf-parser:local}"
    build: *parser-build
    platform: linux/amd64
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOCLING_ARTIFACTS_PATH: /opt/docling/models
    command: [python, /app/src/tools/export_parser_model.py, --destination, /export/paddleocr-vl-1.6]
  # Run tests/checks explicitly with -p paper-tests/-p paper-checks. Their only
  # database is disposable test-db; none of these services mounts library data.
  tests:
    profiles: [tests]
    build: *test-build
    environment:
      LIBRARY_TEST_MODE: "1"
      TEST_DATABASE_URL: postgresql+psycopg://library_test:library_test_only@test-db:5432/library_test
      ACCEPTANCE_DATABASE_URL: postgresql+psycopg://library_test:library_test_only@test-db:5432/library_test
    volumes:
      - ./.agent/harness:/app/.agent/harness:ro
      - ./.agent/relocation.json:/app/.agent/relocation.json:ro
    mem_limit: 4g
    cpus: "4"
    networks: [test_backend]
    depends_on:
      test-db: {condition: service_healthy}
  checks:
    profiles: [checks]
    build: *test-build
    command: [python, src/tools/check_package.py]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  test-db:
    profiles: [tests]
    image: postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
    platform: linux/amd64
    environment:
      POSTGRES_DB: library_test
      POSTGRES_USER: library_test
      POSTGRES_PASSWORD: library_test_only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test_backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U library_test -d library_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
volumes:
  data:
  uploads:
  internal:
  pgdata:
  parser_inputs:
  parser_outputs:
  backups:
  provider_config:
  local_translation_models:
networks:
  backend:
    internal: true
  # Docker does not publish ports from an internal-only network. This bridge
  # exposes the app's one explicitly loopback-bound HTTP port, without a proxy.
  http:
  provider_egress:
  local_model_control:
    internal: true
  # Separate test bridge; internal-only networks cannot publish the host test port.
  test_backend:
    internal: false
  # Only MLX parsing or optional local translation uses this network.
  model_inference:
