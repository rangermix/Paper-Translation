[project]
name = "pdf-parser-cuda"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "jsonschema==4.25.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pypdf==6.16.1",
  "pypdfium2==5.13.0",
  "docling==2.94.0",
  "transformers==5.10.1",
  "lxml==6.1.0",
  "opencv-contrib-python==4.10.0.84",
  "torch==2.9.1+cu126",
  "torchvision==0.24.1+cu126",
  "onnxruntime==1.29.0",
  "paddleocr[doc-parser]==3.7.0; sys_platform == 'linux'",
  "paddlex[genai-client]==3.7.2; sys_platform == 'linux'",
  "paddlepaddle==3.3.1; sys_platform == 'linux'"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-dependencies = ["opencv-python"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
