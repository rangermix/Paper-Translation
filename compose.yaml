# Production services and paths are maintained in one definition.
# Compose 2.20+ resolves included paths relative to deployment/.
name: bilingual-personal-pdf
include:
  - deployment/compose.production.yaml
services:
  verify:
    profiles: [tools]
    build:
      context: .
      dockerfile: deployment/Dockerfile.verify
    command: ["python", "tools/check_package.py"]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
